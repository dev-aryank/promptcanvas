services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: pgvector-db-promptcanvas
    environment:
      POSTGRES_DB: promptcanvasDB
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "9001:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql
    restart: unless-stopped

  minio:
#    image: quay.io/minio/aistor/minio:RELEASE.2026-08-07T18-34-35Z
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-promptcanvas
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9002:9000"   # API
      - "9003:9001"   # Console
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:
  pgvector-data: