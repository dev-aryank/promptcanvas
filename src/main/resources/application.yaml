spring:
  application:
    name: promptcanvas

  datasource:
    url: jdbc:postgresql://localhost:9001/promptcanvasDB
    username: user
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      timeout: 350s
      chat:
        model: openai/gpt-5.3-codex
#        model: openai/gpt-5.1-codex-mini
        temperature: 0.0

jwt:
  secret-key: promptcanvas-dev-jwt-secret-key-not-for-production-use-2026

stripe:
  api:
    secret: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET_KEY}

client:
  url: http://localhost:8080 # Change it to your frontend url (using for success/failure of payment through stripe)

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG


minio:
  url: http://localhost:9002         # or minio:9000 if inside docker network
  access-key: minioadmin
  secret-key: minioadmin123
  project-bucket: promptcanvas